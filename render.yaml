services:
  - type: web
    name: crystal-estates-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: Crystal-Estate
      - key: CLIENT_URL
        sync: false

